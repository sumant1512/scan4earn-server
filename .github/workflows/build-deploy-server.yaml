name: Deploy Cloud Run Release

on:
  workflow_dispatch:
    inputs:
      release_tag:
        description: "Release tag to deploy (latest or v1.0.0)"
        required: true
        default: "latest"
        type: string

env:
  PROJECT_ID: orbital-nirvana-492005-q3
  GAR_LOCATION: us-east4
  REPOSITORY: mscan-server
  SERVICE_NAME: mscan-server
  REGION: us-east4
  IMAGE_NAME: mscan-server

jobs:
  deploy:
    runs-on: ubuntu-latest

    permissions:
      contents: read
      id-token: write

    steps:
      - name: Resolve Release Tag
        id: release
        env:
          INPUT_TAG: ${{ github.event.inputs.release_tag }}
          GH_TOKEN: ${{ github.token }}
        run: |
          if [ "$INPUT_TAG" = "latest" ]; then
            TAG=$(gh release view --json tagName --jq '.tagName')
            echo "Latest release found: $TAG"
          else
            TAG="$INPUT_TAG"
            echo "Using release: $TAG"
          fi

          echo "tag=$TAG" >> "$GITHUB_OUTPUT"

      - name: Validate Release Exists
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release view ${{ steps.release.outputs.tag }}

      - name: Checkout Release Source
        uses: actions/checkout@v4
        with:
          ref: ${{ steps.release.outputs.tag }}
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pyyaml

      - name: Load Cloud Run parameters
        uses: ./.github/actions/read-cloudrun-parameters
        with:
          config_file: cloudrun-config/global-cloudrun.yaml
          env_file: cloudrun-config/global-env-parameters.yaml

      - name: Authenticate to Google Cloud
        id: auth
        uses: google-github-actions/auth@v3
        with:
          workload_identity_provider: ${{ secrets.WIF_PROVIDER }}
          service_account: ${{ secrets.WIF_SERVICE_ACCOUNT }}
          token_format: access_token

      - name: Set up gcloud
        uses: google-github-actions/setup-gcloud@v2
        with:
          project_id: ${{ env.PROJECT_ID }}

      - name: Configure Docker Authentication
        uses: docker/login-action@v3
        with:
          registry: ${{ env.GAR_LOCATION }}-docker.pkg.dev
          username: oauth2accesstoken
          password: ${{ steps.auth.outputs.access_token }}

      - name: Build and Push Docker Image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          push: true
          tags: |
            ${{ env.GAR_LOCATION }}-docker.pkg.dev/${{ env.PROJECT_ID }}/${{ env.REPOSITORY }}/${{ env.IMAGE_NAME }}:${{ steps.release.outputs.tag }}

      - name: Render Cloud Run Manifest
        env:
          SERVICE_IMAGE: ${{ env.GAR_LOCATION }}-docker.pkg.dev/${{ env.PROJECT_ID }}/${{ env.REPOSITORY }}/${{ env.IMAGE_NAME }}:${{ steps.release.outputs.tag }}
          SERVICE_CONTAINER_NAME: nodejsapp
        run: |
          python - <<'PY'
          import os
          import re
          import yaml
          from pathlib import Path

          template_path = Path("cloudrun-config/cloudrun-config.yaml")
          output_path = Path("cloudrun-config/rendered-cloudrun.yaml")

          placeholder_re = re.compile(r"\$\{([A-Z0-9_]+)\}")

          def render(obj):
              if isinstance(obj, str):
                  def repl(match):
                      key = match.group(1)
                      return os.environ[key]
                  return placeholder_re.sub(repl, obj)

              if isinstance(obj, list):
                  return [render(i) for i in obj]

              if isinstance(obj, dict):
                  return {k: render(v) for k, v in obj.items()}

              return obj

          template = yaml.safe_load(template_path.read_text())
          rendered = render(template)

          output_path.write_text(
              yaml.safe_dump(rendered, sort_keys=False)
          )

          print(f"Rendered manifest: {output_path}")
          PY

      - name: Deploy to Cloud Run
        run: |
          gcloud run services replace cloudrun-config/rendered-cloudrun.yaml \
            --region "${REGION}" \
            --project "${PROJECT_ID}"

      - name: Show Service URL
        run: |
          gcloud run services describe "${SERVICE_NAME}" \
            --region "${REGION}" \
            --project "${PROJECT_ID}" \
            --format="value(status.url)"
